services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: owr
      POSTGRES_PASSWORD: owr
      POSTGRES_DB: oldwivesreveal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
